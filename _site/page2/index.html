<h2 id="重要知识">重要知识</h2>

<ol>
  <li><code class="language-plaintext highlighter-rouge">select_store</code>策略
“存储策略”指的就是一个volume的其中一个shard可以有多个replica，副本分别放在哪些主机上。
<img src="\assets\251010-image1.png" alt="20251010-image1" /></li>
</ol>

<p>创建卷下面有shard，每个shard有多个replica，select_store的作用就是给每个replica分配存储节点位置。当主副本被指定时，默认优先存储在指定主机上，当未指定则根据剩余空间指定存储位置。</p>

<div class="language-java highlighter-rouge"><div class="highlight"><pre class="highlight"><code><span class="n">select_store</span><span class="o">(</span><span class="n">trans</span><span class="o">,</span> <span class="n">v</span><span class="o">.</span><span class="na">rep_count</span><span class="o">,</span> <span class="n">volume_size</span><span class="o">,</span> <span class="n">store_name</span><span class="o">,</span> <span class="n">tray_ids</span><span class="o">,</span> <span class="n">store_idx</span><span class="o">,</span> <span class="n">hostId</span><span class="o">);</span>
</code></pre></div></div>
<ul>
  <li>当用户指定了存储节点时：
查询数据库获取指定存储节点的信息
如果还指定了托盘，则验证这些托盘是否有足够的空间存放卷数据
直接使用用户指定的存储节点和托盘</li>
  <li>当用户未指定存储节点时：
调用 select_suitable_store_tray 方法自动选择合适的存储节点和托盘
根据存储节点的剩余空间进行智能分配</li>
</ul>

<p>host_id被选择(hostId != -1)，当指定了 hostId 参数时，会优先将主副本放置在该主机上，其他副本分散到其他节点上。当 hostId != -1（即 hostId 是一个有效的正整数）时，表示用户明确指定了主副本应该放置在哪个主机上。
当 hostId == -1 时，表示没有指定特定的主机来放置主副本。在这种情况下，系统会采用默认的分布策略来选择存储节点。(策略负载均衡)</p>

<p>存储节点用select_store方法选择，其中分为两种情况，当主副本被指定时，默认优先存储在指定主机上，当未指定则根据剩余空间指定存储位置。</p>
